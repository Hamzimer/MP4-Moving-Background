name: Publish desktop installers

on:
  push:
    branches: [main]
    paths:
      - dist/Moving-Background-macOS.dmg
      - dist/Moving-Background-Windows-x64-Setup.exe
  workflow_dispatch:

concurrency: publish-desktop-installers

env:
  VERSION: v1.4.0

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/Moving-Background-macOS.dmg dist/Moving-Background-Windows-x64-Setup.exe dist/SHA256SUMS.txt
          else
            gh release create "$VERSION" dist/Moving-Background-macOS.dmg dist/Moving-Background-Windows-x64-Setup.exe dist/SHA256SUMS.txt \
              --target "$GITHUB_SHA" --title "Moving Background $VERSION" --notes-file docs/release-notes.md
          fi
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Publish installer bundle to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$VERSION"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --tag "$image" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.description=Offline macOS and Windows installers for Moving Background" \
            --file - dist <<'DOCKERFILE'
          FROM scratch
          COPY Moving-Background-macOS.dmg Moving-Background-Windows-x64-Setup.exe SHA256SUMS.txt /installers/
          DOCKERFILE
          docker push "$image"
